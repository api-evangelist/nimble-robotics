aid: nimble-robotics
name: Nimble Robotics
description: 'Nimble Robotics (Nimble) is an autonomous robotic third-party logistics
  (3PL) company building AI-powered robots that pick, pack, and fulfill ecommerce orders
  with minimal human intervention. Founded by Simon Kalouche, the company operates fully
  autonomous robotic fulfillment centers and is training general-purpose robot AI to
  power fast, economical commerce. Backed by Accel and partnered with FedEx, Nimble
  raised a $106M Series C at a $1B valuation, with board member Marc Raibert (Boston
  Dynamics founder). Nimble is a physical robotics and logistics operator and does not
  currently publish a public developer API, SDK, or documentation surface.'
